@if (loading()) {
  <div class="center">
    <mat-spinner diameter="48" />
  </div>
} @else {
  <div class="header">
    <h3>Error Logs</h3>
    <button mat-icon-button (click)="loadLogs()" matTooltip="Refresh">
      <mat-icon>refresh</mat-icon>
    </button>
  </div>

  @if (logs().length === 0) {
    <div class="empty-state">
      <mat-icon>check_circle</mat-icon>
      <p>No error sessions found</p>
    </div>
  } @else {
    <table mat-table [dataSource]="logs()">
      <ng-container matColumnDef="created_at">
        <th mat-header-cell *matHeaderCellDef>Timestamp</th>
        <td mat-cell *matCellDef="let row">{{ row.created_at | date:'short' }}</td>
      </ng-container>

      <ng-container matColumnDef="council_name">
        <th mat-header-cell *matHeaderCellDef>Council</th>
        <td mat-cell *matCellDef="let row">{{ row.council_name }}</td>
      </ng-container>

      <ng-container matColumnDef="input_claim">
        <th mat-header-cell *matHeaderCellDef>Claim</th>
        <td mat-cell *matCellDef="let row" class="claim-cell" [matTooltip]="row.input_claim">
          {{ row.input_claim.length > 60 ? row.input_claim.substring(0, 60) + '...' : row.input_claim }}
        </td>
      </ng-container>

      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef></th>
        <td mat-cell *matCellDef="let row">
          <button mat-icon-button (click)="viewSession(row.session_id)" matTooltip="View session">
            <mat-icon>open_in_new</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>
  }
}
