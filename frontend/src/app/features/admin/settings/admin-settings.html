@if (loading()) {
  <div class="center">
    <mat-spinner diameter="48" />
  </div>
} @else {
  <!-- API Key Section -->
  <div class="settings-section glass-panel">
    <h3>
      <mat-icon>key</mat-icon>
      API Key
    </h3>
    @if (currentApiKey()) {
      <p class="current-value">Current: <code>{{ currentApiKey() }}</code></p>
    }
    <div class="field-row">
      <mat-form-field class="flex-field">
        <mat-label>New API Key</mat-label>
        <input matInput type="password" #apiKeyInput
          [value]="newApiKey()"
          (input)="newApiKey.set(apiKeyInput.value)"
          placeholder="sk-ant-...">
      </mat-form-field>
      <button mat-flat-button (click)="saveApiKey()" [disabled]="!newApiKey() || saving()">
        Update Key
      </button>
    </div>
  </div>

  <!-- Model Config Section -->
  <div class="settings-section glass-panel">
    <h3>
      <mat-icon>tune</mat-icon>
      Model Configuration
    </h3>

    <mat-form-field class="full-width">
      <mat-label>Default Model</mat-label>
      <mat-select [value]="selectedModel()" (selectionChange)="selectedModel.set($event.value)">
        @for (opt of modelOptions; track opt.value) {
          <mat-option [value]="opt.value">{{ opt.label }}</mat-option>
        }
      </mat-select>
    </mat-form-field>

    <div class="slider-field">
      <label>Temperature: {{ temperature() }}</label>
      <mat-slider min="0" max="2" step="0.1" discrete>
        <input matSliderThumb
          [value]="temperature()"
          (valueChange)="temperature.set($event)">
      </mat-slider>
    </div>

    <mat-form-field class="full-width">
      <mat-label>Max Tokens</mat-label>
      <input matInput type="number" min="256" max="8192" step="256" #maxTokensInput
        [value]="maxTokens()"
        (input)="maxTokens.set(+maxTokensInput.value)">
    </mat-form-field>

    <div class="form-actions">
      <button mat-flat-button (click)="saveModelConfig()" [disabled]="saving()">
        @if (saving()) {
          <mat-spinner diameter="20" />
        }
        Save Configuration
      </button>
    </div>
  </div>
}
