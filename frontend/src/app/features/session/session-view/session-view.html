<section class="session-view">
  <header class="session-header">
    <h1>Session</h1>
    <span class="status-badge" [class]="sessionStatus()">{{ sessionStatus() }}</span>
  </header>

  <app-debate-panel
    [messages]="messages()"
    [agents]="agents()"
    [currentRound]="currentRound()" />

  @if (showHumanTurnInput()) {
    <app-human-turn-input
      [sessionId]="sessionId()"
      (submitted)="onHumanTurnSubmitted()" />
  }

  @if (isVotingPhase()) {
    <app-voting-panel
      [votes]="votes()"
      [agents]="agents()"
      [votingMechanism]="votingMechanism()" />
  }

  @if (showHumanForm()) {
    <app-human-vote-form
      [sessionId]="sessionId()"
      (voted)="onHumanVoted($event)" />
  }

  @if (isComplete() && verdict(); as v) {
    <app-verdict-card [verdict]="v" />
  }
</section>
