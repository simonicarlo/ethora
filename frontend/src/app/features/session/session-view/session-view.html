<section class="session-view">
  <header class="session-header">
    <h1>Session</h1>
    <span class="status-badge" [class]="sessionStatus()">{{ sessionStatus() }}</span>
  </header>

  @if (loading()) {
    <div class="loading-container">
      <mat-spinner diameter="48"></mat-spinner>
      <p>Loading session…</p>
    </div>
  } @else {
    @if (sessionStatus() === 'error') {
      <div class="error-banner">
        <p>This session encountered an error and cannot continue.</p>
      </div>
    }

    <app-debate-panel
      [messages]="messages()"
      [agents]="agents()"
      [currentRound]="currentRound()"
      [inputClaim]="inputClaim()" />

    @if (showHumanTurnInput()) {
      <app-human-turn-input
        [sessionId]="sessionId()"
        (submitted)="onHumanTurnSubmitted($event)" />
    }

    @if (isVotingPhase()) {
      <app-voting-panel
        [votes]="votes()"
        [agents]="agents()"
        [votingMechanism]="votingMechanism()" />
    }

    @if (showHumanForm()) {
      <app-human-vote-form
        [sessionId]="sessionId()"
        (voted)="onHumanVoted($event)" />
    }

    @if (isComplete() && verdict(); as v) {
      <app-verdict-card [verdict]="v" />
    }
  }
</section>
